<!DOCTYPE html>
<html>
<head>
  <title>pico-cpu-temp</title>
  <link rel="icon" href="/icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <style>
    html, body, #root {
      height: 100%; width: 100%; font-family: system-ui; margin: 0;
    }
    #root {
      margin: .5em;
      width: calc(100% - 1em);
      flex-grow: 1;
      display: flex; flex-direction: column;
    }
  </style>
  <script src="/lib.js"></script>
</head>
<body>

  <div id="root">
    <div>
      <b>pico-cpu-temp</b>&nbsp;&nbsp;<i>CPU temperature reading</i>
      <span id="back-to-menu" style="float:right;font-size:.85em">[ <a style="color:#ff8686" href="/">back to menu</a> ]</span>
      <script>
        if (location.pathname === '/') lib.Q('#back-to-menu').style.display = 'none'
      </script>
    </div>
    <br />
    <div>
      last reading (°F): <span id="readings" style="white-space: pre-wrap">(no readings yet)</span>
    </div>
    <script>
      const readings = lib.Q('#readings')
      setTimeout(async () => {
        for (let i = 0;; i++) {
          const reading = await fetch('/cpu-temperature').then(res => res.text())
          const value = Number(reading)
          readings.textContent = value.toFixed(3) + '\n' + (i > 0 ? readings.textContent.replace('\n', ' ') : '')
          await new Promise(resolve => setTimeout(resolve, 1000))
        }
      })
    </script>
  </div>

</body>
</html>
