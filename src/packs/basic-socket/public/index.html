<!DOCTYPE html>
<html>
<head>
<meta charset=utf-8><meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://freshman.dev/copyright.js"></script><meta data-hydrate data-style />

<title>echo</title>
<style>
  html, body, #root {
    height: 100%;
    width: 100%;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-size: inherit;
    font-family: inherit;
  }
  #root {
    font-size: max(16px, 1em);
    width: min(40em, 100%);
    padding: .5em;
    border: 1px solid #000;
    border-radius: .5em;
  }
  #input {
    background: #000 !important;
    color: #fff !important;
    border-color: #000 !important;
    min-height: 1.5em;
    border-radius: .75em;
    padding: .5em;
    resize: none;
  }
  #input, #messages {
    width: 100%;
  }
  #messages {
    height: 0; flex-grow: 1;
    flex-direction: column-reverse;
  }
  .message {
    border: 1px solid #000;
    border-radius: .67em;
    padding: .1667em .67em;
    max-width: min(30em, 100vw);
  }
  .info {
    font-size: .67em;
  }
  .self {
    align-self: flex-end;
    &.message {
      background: #000;
      color: #fff;
    }
  }
</style>
</head>
<body>
  
  <div id=root class="spaced" style="
  display: flex; flex-direction: column;
  "></div>
  <script>
    const log = named_log('base-socket')
    const id = store.get('pico-fi_echo_id') || rand.alphanum(16)

    root.innerHTML = 'waiting to connect...'
    let ws = undefined
    const connect = () => {
      try {
        ws = new WebSocket('ws://' + location.host)
      } catch (e) {
        ws = {
          send: (...x) => log('send', ...x),
        }
      }
      ws.onopen = () => {
        root.innerHTML = ''
        const input = node(`<textarea id="input" placeholder="enter message" rows="1"></textarea>`)
        const message_list = node(`<div id="messages" class="column gap"></div>`)
        root.append(message_list, input)

        let last_id = undefined
        ws.onmessage = e => {
          const [type, ...args] = e.data.split(' ')
          const content = args.join(' ')
          switch (type) {
            case 'echo-echo':{
              const [other, ...message_parts] = args
              const message = message_parts.join(' ')
              if (last_id !== other) {
                message_list.prepend(node(`<div class="info ${other === id ? 'self' : ''}">${id}</div>`))
                last_id = other
              }
              message_list.prepend(node(`<div class="message ${other === id ? 'self' : ''}">${message}</div>`))
            }break
            case 'echo-join':{
              const other = content
              message_list.prepend(node(`<div class="info ${other === id ? 'self' : ''}">${content} connected</div>`))
            }break
            case 'echo-leave':{
              message_list.prepend(node(`<div class="info">${content} disconnected</div>`))
            }break
          }
        }

        const handle = {
          join: () => {
            ws.send(`echo-join ${id}`)
          },
          leave: () => {
            ws.send(`echo-leave ${id}`)
          },
          message: (message) => {
            ws.send(`echo-echo ${id} ${message}`)
          },
        }
        on(input, 'keydown', e => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault()
            handle.message(input.value)
            input.value = ''
          } else {
            defer(() => {
              // resize textarea
              input.style.height = 0
              input.style.height = `calc(2px + ${input.scrollHeight}px)` // scrollHeight plus border
            })
          }
        })
        handle.join()
        on(window, 'beforeunload', () => {
          handle.leave()
        })
      }
      ws.onclose = () => {
        ws.onmessage = undefined
        root.innerHTML = `disconnected`
        connect()
      }

      if (!location.host) ws.onopen()
    }
    connect()

  </script>

</body>
</html>
